[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gradeguard"
version = "0.1.0"
description = "A local pre-submission checker for programming assignments."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "6U5U" }]
dependencies = ["PyYAML>=6.0,<7"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Topic :: Education",
  "Topic :: Software Development :: Quality Assurance",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
gradeguard = "gradeguard.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gradeguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

